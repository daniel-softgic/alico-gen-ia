@keyframes drive{0%{transform:translate(0,0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translate(522px,301px);opacity:0}}

@keyframes driveb{0%{transform:translate(0,0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translate(-522px,-301px);opacity:0}}

<script>
'use strict';
/* ============================ datos de los 5 casos ============================ */
const Z = [
  {n: 1, id: 'vision', corto: 'La cámara revisa cada pieza', c: '#00BED6', nombre: 'Visión artificial', pub: 'Operarios, supervisores de línea y Calidad', area: 'Operaciones · Línea de producción', ini: 'Detección automática de defectos en fundas impresas (Colombia)', txt: 'La cámara aprende qué es una funda buena y frena los defectos en tiempo real, sin detener la banda.'},
  {n: 2, id: 'maestro', corto: 'El operario le habla a la máquina', c: '#EE7623', nombre: 'Maestro · asistente de planta', pub: 'Operarios de planta y líderes de turno', area: 'Producción · Piso de planta', ini: 'Soporte técnico en planta y traspaso de turno', txt: 'El operario habla o toca un botón, Maestro responde. Lo que uno aprende queda para todos los turnos.'},
  {n: 3, id: 'conocimiento', corto: 'Respuestas técnicas con fuente', c: '#00758D', nombre: 'Agente de conocimiento técnico', pub: 'Técnicos, supervisores, I+D y Soporte técnico', area: 'Soporte técnico · Paraguay', ini: 'Agente de IA para soporte técnico en planta (Paraguay)', txt: 'Manuales y experiencia técnica en un agente que responde citando la fuente, las 24 horas.'},
  {n: 4, id: 'reclamos', corto: 'Cada mensaje del cliente, atendido', c: '#E99B35', nombre: 'Centro de inteligencia del cliente', pub: 'Servicio al cliente, Calidad, Logística, Ventas y Finanzas', area: 'Calidad y servicio · Chile', ini: 'Plataforma digital de reclamos y devoluciones (Chile + Epicor)', txt: 'Del reclamo a la nota crédito: captura, triage con IA, causa raíz, Epicor y analítica de calidad.'},
  {n: 5, id: 'torre', corto: 'Todo el negocio en una pantalla', c: '#6C7A89', nombre: 'Torre de control de negocios', pub: 'Gerencia, Ventas, Distribución y Cadena de suministro', area: 'Gerencia · Logística y despachos', ini: 'Inteligencia de negocio para decidir: ventas, distribución e inventario', txt: 'Ventas, despachos e inventario en una sola pantalla. Y puedes preguntarle a tus datos con IA.'}
];
const RUTA = {vision: 'casos/vision/index.html', maestro: 'casos/maestro/index.html', conocimiento: 'casos/conocimiento/index.html', reclamos: 'casos/reclamos/index.html', torre: 'casos/torre/index.html'};

/* ============================ geometría isométrica ============================ */
const CW = 36, CH = 20.8, ZU = 26;
const P = (x, y, z = 0) => [(x - y) * CW, (x + y) * CH - z * ZU];
const pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
function sh(c, k) { const v = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const f = k > 0 ? t => Math.round(t + (255 - t) * k) : t => Math.round(t * (1 + k)); return '#' + v.map(f).map(t => Math.max(0, Math.min(255, t)).toString(16).padStart(2, '0')).join(''); }
function box(x, y, z, w, d, h, c, o = {}) {
  const top = o.top || sh(c, .2), L = o.l || c, R = o.r || sh(c, -.2), st = o.stroke ? `stroke="${o.stroke}" stroke-width="${o.sw || .6}" stroke-linejoin="round"` : '';
  const op = o.op != null ? ` opacity="${o.op}"` : '';
  let s = '';
  if (!o.noL) s += `<polygon points="${pts([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)])}" fill="${L}" ${st}${op}/>`;
  if (!o.noR) s += `<polygon points="${pts([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)])}" fill="${R}" ${st}${op}/>`;
  if (!o.noT) s += `<polygon points="${pts([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)])}" fill="${top}" ${st}${op}/>`;
  return s;
}
function flat(x, y, z, w, d, fill, extra = '') { return `<polygon points="${pts([P(x, y, z), P(x + w, y, z), P(x + w, y + d, z), P(x, y + d, z)])}" fill="${fill}" ${extra}/>`; }
function cyl(cx, cy, z, r, h, c, o = {}) {
  const [bx, by] = P(cx, cy, z), [, ty] = P(cx, cy, z + h), rx = r * CW * 1.414, ry = r * CH * 1.414;
  return `<path d="M${bx - rx},${ty} L${bx - rx},${by} A${rx},${ry} 0 0 0 ${bx + rx},${by} L${bx + rx},${ty} Z" fill="${c}"/>
  <path d="M${bx + rx * .25},${ty} L${bx + rx * .25},${by + ry * .97} A${rx},${ry} 0 0 0 ${bx + rx},${by} L${bx + rx},${ty} Z" fill="#000" opacity=".13"/>
  <ellipse cx="${bx}" cy="${ty}" rx="${rx}" ry="${ry}" fill="${o.top || sh(c, .25)}"/>`;
}
function person(x, y, z, o = {}) {
  const [px, py] = P(x, y, z), s = (o.s || 1) * 1.3, sk = o.skin || '#E8B58F', sh1 = o.shirt || '#00758D', pa = o.pants || '#3b4a5a';
  let hat = '';
  if (o.hat === 'hard') hat = `<path d="M-7,-39 a7,7 0 0 1 14,0 z" fill="${o.hc || '#E99B35'}"/><rect x="-8.2" y="-39.6" width="16.4" height="2.6" rx="1.3" fill="${o.hc || '#E99B35'}"/>`;
  else if (o.hat === 'net') hat = `<path d="M-6.4,-39 a6.4,6.4 0 0 1 12.8,0 z" fill="#fff" opacity=".95"/>`;
  else hat = `<path d="M-6.4,-39.5 a6.6,6.6 0 0 1 13.2,0 q-3,-2.6 -6.6,-2.6 q-3.6,0 -6.6,2.6z" fill="${o.hair || '#3a2a20'}"/>`;
  const head = o.headset ? `<path d="M-7,-38 a7,7 0 0 1 14,0" fill="none" stroke="#222" stroke-width="2"/><rect x="-8.6" y="-39" width="3" height="6" rx="1.5" fill="#222"/><rect x="5.6" y="-39" width="3" height="6" rx="1.5" fill="#222"/><path d="M-7,-34 q-1,5 5,5" fill="none" stroke="#222" stroke-width="1.4"/>` : '';
  const arms = o.arm === 'up' ? `<rect x="-11" y="-31" width="4" height="13" rx="2" fill="${sh1}"/><rect x="6.5" y="-44" width="4" height="15" rx="2" fill="${sh1}" transform="rotate(20 8 -30)" class="wv"/>` : `<rect x="-11" y="-31" width="4" height="14" rx="2" fill="${sh1}"/><rect x="7" y="-31" width="4" height="14" rx="2" fill="${sh1}"/>`;
  return `<g class="bob" style="--px:${px}px;--py:${py}px;animation-delay:${o.dl || 0}s;transform:translate(${px}px,${py}px)"><g transform="scale(${s})">
  <ellipse cx="0" cy="1" rx="9" ry="3.6" fill="#000" opacity=".16"/>
  <rect x="-5" y="-14" width="4.4" height="14" rx="2" fill="${pa}"/><rect x="0.6" y="-14" width="4.4" height="14" rx="2" fill="${pa}"/>
  ${arms}<rect x="-7" y="-31" width="14" height="19" rx="6" fill="${sh1}"/>
  ${o.badge ? `<rect x="-3" y="-27" width="6" height="4" rx="1" fill="#fff" opacity=".85"/>` : ''}
  <circle cx="0" cy="-37" r="6.2" fill="${sk}"/>${hat}${head}</g></g>`;
}
function tree(x, y, s = 1, c = '#6FAE6B') { const [px, py] = P(x, y, 0); return `<g transform="translate(${px},${py}) scale(${s})"><ellipse cx="0" cy="2" rx="12" ry="5" fill="#000" opacity=".14"/><rect x="-2" y="-16" width="4" height="17" fill="#8a6a4a"/><circle cx="0" cy="-28" r="13" fill="${c}"/><circle cx="-7" cy="-21" r="9" fill="${sh(c, -.1)}"/><circle cx="7" cy="-22" r="9" fill="${sh(c, .12)}"/></g>`; }
function skewL(x, y, z, inner) { const [px, py] = P(x, y, z); return `<g transform="translate(${px},${py}) skewY(30)">${inner}</g>`; }
function skewR(x, y, z, inner) { const [px, py] = P(x, y, z); return `<g transform="translate(${px},${py}) skewY(-30)">${inner}</g>`; }
function truck(x, y, c = '#fff', cab = '#EE7623') {
  return box(x, y, 0.12, 1.55, 0.78, 0.85, c) + box(x + 1.58, y + .04, 0.12, 0.55, 0.7, 0.62, cab) + box(x + 1.66, y + .1, .5, .3, .62, .3, '#BDE9F2', {noT: false}) +
    cyl(x + .35, y + .8, 0, .16, .14, '#222') + cyl(x + 1.3, y + .8, 0, .16, .14, '#222') + cyl(x + 1.85, y + .78, 0, .16, .14, '#222') + skewL(x + .15, y + .78, .62, `<rect x="2" y="-12" width="30" height="7" rx="2" fill="${cab}" opacity=".9"/>`);
}
function car(x, y, c) { return box(x, y, .1, .95, .5, .32, c) + box(x + .22, y + .05, .42, .5, .4, .26, sh(c, .35)) + cyl(x + .2, y + .52, 0, .1, .1, '#222') + cyl(x + .78, y + .52, 0, .1, .1, '#222'); }
function pin(z, x, y) {
  return `<g class="pin" data-z="${z.id}" style="--px:${x}px;--py:${y}px;transform:translate(${x}px,${y}px)"><g class="pb">
  <ellipse cx="0" cy="26" rx="9" ry="3.5" fill="#000" opacity=".2"/><path d="M-8,13 L0,26 L8,13 Z" fill="${z.c}"/>
  <circle cx="0" cy="0" r="19" fill="${z.c}" stroke="#fff" stroke-width="4"/>
  <text x="0" y="6.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${z.n}</text></g></g>`;
}

/* ============================ construcción de la escena ============================ */
function shell(x0, y0, w, d, c, o = {}) {
  const wall = o.wall || '#F5F0E8', h = o.h || 1.35, floor = o.floor || '#C9D0D6';
  let s = box(x0, y0, 0, w, d, .16, floor, {top: o.ftop || sh(floor, .15), l: sh(floor, -.08), r: sh(floor, -.18)});

      <text x="40" y="17" font-size="11.5" font-weight="700" fill="#2b2e30">${txt}</text><text x="40" y="31" font-size="9.5" fill="#53575A">${cn} · ${who}</text></g>`;
    layer.appendChild(g);
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'), mx = (st[0] + T[0]) / 2, my = Math.min(st[1], T[1]) - 140;
    p.setAttribute('d', `M${st[0]},${st[1]} Q${mx},${my} ${T[0]},${T[1] - 30}`); const L = p.getTotalLength(), dur = 5200, t0 = performance.now();
    (function fr(now) { const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, q = p.getPointAtLength(e * L), sc = 1 - .45 * e;
      g.setAttribute('transform', `translate(${q.x},${q.y}) scale(${sc})`); g.setAttribute('opacity', t > .88 ? (1 - t) / .12 : Math.min(1, t * 6));
      g.setAttribute('transform', `translate(${q.x},${q.y}) scale(${1.55 * sc})`);
      if (t < 1) requestAnimationFrame(fr); else { g.remove(); const z = zEl('reclamos'); z && z.classList.add('spot'); setTimeout(() => z && !tour && z.classList.remove('spot'), 500); } })(t0);
    setTimeout(launch, 2300);
  }

})();

/* ---------- conveyor de visión artificial (dinámico) ---------- */
(function () {
  const g = document.getElementById('belt'); if (!g) return;
  const N = 6, X0 = .95, X1 = 6.25, TC = 3.72, rnd = AL.rng(7);
  const items = [];
  for (let i = 0; i < N; i++) {
    const wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.appendChild(wrap);
    const bad = rnd() < .3; const c = ['#FFFFFF', '#F7E3C0', '#DDF3F7'][i % 3];
    wrap.innerHTML = box(0, 5.12, .42, .62, .62, .2, c, {stroke: '#c9c2b4'}) + flat(.08, 5.2, .63, .46, .46, '#E99B35', 'opacity=".9"') + `<polygon class="bad" points="${pts([P(.12, 5.28, .64), P(.3, 5.28, .64), P(.3, 5.4, .64), P(.12, 5.4, .64)])}" fill="#d6403a" opacity="0"/>`;
    items.push({wrap, t: X0 + (X1 - X0) * i / N, bad, judged: false});
  }
  let ok = 128, bad = 3, last = performance.now(), vis = 0;
  const scr = document.getElementById('scrTxt'), v = document.getElementById('verdict'), vBg = document.getElementById('vBg'), vTx = document.getElementById('vTx');
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    items.forEach(it => {
      it.t += dt * .75;
      if (it.t > X1) { it.t = X0; it.judged = false; it.bad = rnd() < .28; it.wrap.querySelector('.bad').setAttribute('opacity', 0); }
      it.wrap.setAttribute('transform', `translate(${it.t * CW},${it.t * CH})`);
      it.wrap.setAttribute('opacity', it.t < X0 + .25 ? (it.t - X0) / .25 : it.t > X1 - .3 ? (X1 - it.t) / .3 : 1);
      if (!it.judged && it.t >= TC) {
        it.judged = true;
        if (it.bad) { bad++; it.wrap.querySelector('.bad').setAttribute('opacity', .95); vBg.setAttribute('fill', '#d6403a'); vTx.textContent = '✖ DEFECTO'; } else { ok++; vBg.setAttribute('fill', '#2BD67B'); vTx.textContent = '✔ CONFORME'; }
        v.classList.remove('show'); void v.getBBox(); v.classList.add('show');
        scr.textContent = `OK ${ok} · ✖ ${bad}`; scr.setAttribute('fill', it.bad ? '#FF7A7C' : '#2BD67B');
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
