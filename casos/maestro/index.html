<style>
:root{

  --tl:#00BED6; --tl2:#008AAB; --tl-d:#00758D;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,1.15vw,26px)}
body{margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
header.top{display:flex;align-items:center;gap:1rem;padding:.7rem 1.6rem;background:#fff;border-bottom:4px solid var(--or);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:.8rem;cursor:pointer}
.brand b{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:.7rem;color:var(--gr);font-weight:500;margin-top:-.15rem}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border-radius:99px;font-size:.78rem;font-weight:600;background:#eef6f8;color:var(--tl-d);white-space:nowrap}
.chip.warn{background:#fff3da;color:#8a6200}.chip.bad{background:#fde6e5;color:var(--bad)}.chip.ok{background:#e2f6ec;color:var(--ok)}
.chip.sample{background:#fff3da;color:#8a6200}
.hbtn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.45rem .9rem;font-weight:600;font-size:.85rem;display:inline-flex;gap:.4rem;align-items:center}
.hbtn:hover{border-color:var(--or)}
main{flex:1;padding:1.4rem 1.8rem 2rem;max-width:1700px;width:100%;margin:0 auto}
.guide{display:flex;align-items:center;gap:1rem;background:linear-gradient(90deg,#e6f9fc,#fff);border:2px solid #b9eaf1;border-radius:var(--r);padding:.9rem 1.3rem;margin-bottom:1.2rem}
.guide .gi{font-size:2rem}
.guide b{font-size:1.15rem;display:block}
.guide span{color:var(--gr);font-size:.9rem}
.steps-bar{display:flex;gap:.5rem;margin-left:auto}
.steps-bar i{font-style:normal;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#fff;border:2px solid #b9eaf1;color:var(--tl-d)}
.steps-bar i.on{background:var(--tl2);color:#fff;border-color:var(--tl2)}
.steps-bar i.done{background:var(--ok);border-color:var(--ok);color:#fff}
.hero{display:flex;align-items:center;gap:1.4rem;margin-bottom:1.2rem}
.hero h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--gr);font-size:1.05rem;margin-top:.2rem}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:1rem 1.4rem;box-shadow:var(--sh)}
.tiles{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:1.2rem}
.tile{border-radius:28px;padding:1.8rem 1.6rem;text-align:left;color:#fff;display:flex;flex-direction:column;gap:.6rem;min-height:17rem;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.18)}
.tile:active{transform:scale(.98)}
.tile .big{font-size:4.2rem;line-height:1}
.tile h2{font-size:1.65rem;font-weight:800;line-height:1.15}
.tile p{font-size:1rem;opacity:.95}
.tile .num{position:absolute;right:1.2rem;top:1rem;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.25);border-radius:99px;padding:.15rem .7rem}
.t1{background:linear-gradient(135deg,var(--or),var(--or2))}
.t2{background:linear-gradient(135deg,var(--tl2),var(--tl))}
.t3{background:linear-gradient(135deg,#5b6a72,var(--gr))}
.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(238,118,35,.5)}70%{box-shadow:0 0 0 24px rgba(238,118,35,0)}100%{box-shadow:0 0 0 0 rgba(238,118,35,0)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1.2rem}
.panelbtn{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:1.1rem 1.4rem;display:flex;align-items:center;gap:1rem;text-align:left;box-shadow:var(--sh)}
.panelbtn:hover{border-color:var(--or)}
.panelbtn .big{font-size:2.2rem}.panelbtn b{display:block;font-size:1.1rem}.panelbtn span{color:var(--gr);font-size:.85rem}
.nota{background:#fff;border:2px dashed var(--tl);border-radius:var(--r);padding:1rem 1.4rem;display:flex;gap:1rem;align-items:center;margin-top:1.2rem}
.nota .big{font-size:2.4rem}.nota b{display:block}.nota span{color:var(--gr);font-size:.92rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.4rem}
.how div{background:#fff;border-radius:var(--r);padding:1rem 1.2rem;display:flex;gap:.9rem;align-items:center;border:2px solid var(--line)}
.how em{font-style:normal;font-size:2rem}.how b{display:block;font-size:.95rem}.how span{font-size:.82rem;color:var(--gr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.9rem 1.6rem;border-radius:18px;font-weight:700;font-size:1.05rem;background:var(--or);color:#fff;box-shadow:0 4px 0 var(--or-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--or-d)}
.btn.tl{background:var(--tl2);box-shadow:0 4px 0 var(--tl-d)}
.btn.gr{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #11703f}.btn.bad{background:var(--bad);box-shadow:0 4px 0 #9d2823}.btn.warn{background:var(--warn);box-shadow:0 4px 0 #a97800}
.btn.lg{padding:1.2rem 2.2rem;font-size:1.3rem;border-radius:22px}
.btn[disabled]{opacity:.5;pointer-events:none}
.back{margin-bottom:1rem}
.search{display:flex;gap:.8rem;align-items:center;margin-bottom:1.1rem;flex-wrap:wrap}
.search input{flex:1;min-width:16rem;padding:1rem 1.2rem;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:1.05rem}
.search input:focus,textarea:focus,select:focus{outline:3px solid #b9eaf1;border-color:var(--tl)}
.mic{width:4.6rem;height:4.6rem;border-radius:50%;background:var(--or);color:#fff;font-size:2rem;display:grid;place-items:center;box-shadow:0 4px 0 var(--or-d)}
.mic.on{background:var(--bad);animation:pulse2 1.2s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(214,64,58,.55)}70%{box-shadow:0 0 0 22px rgba(214,64,58,0)}100%{box-shadow:0 0 0 0 rgba(214,64,58,0)}}
.heard{background:#fff;border-radius:18px;border:2px solid var(--line);padding:.8rem 1.1rem;margin-bottom:1rem;display:flex;gap:.8rem;align-items:flex-start}
.ans{background:linear-gradient(135deg,#fff,#e9fbfe);border:2px solid var(--tl);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:1.2rem}
.ans h3{font-size:1.1rem;margin-bottom:.4rem}.ans p{font-size:1.1rem;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:1rem}
.cc{background:#fff;border-radius:24px;border:2px solid var(--line);padding:1.1rem 1.1rem 1.2rem;text-align:left;display:flex;flex-direction:column;gap:.45rem;box-shadow:var(--sh);position:relative;border-top:8px solid var(--ac,var(--or));min-height:12rem;transition:transform .12s}
.cc:hover{transform:translateY(-3px);border-color:var(--ac,var(--or))}
.cc:active{transform:scale(.98)}
.cc .ic{font-size:3rem;line-height:1}.cc h3{font-size:1.05rem;font-weight:700;line-height:1.2}
.cc .ar{font-size:.72rem;font-weight:700;color:var(--ac,var(--or));text-transform:uppercase;letter-spacing:.05em}
.cc .badge{position:absolute;top:.6rem;right:.6rem;font-size:.65rem;font-weight:700;padding:.15rem .55rem;border-radius:99px;background:#fff3da;color:#8a6200}
.cc .badge.new{background:#e2f6ec;color:var(--ok)}.cc .badge.crit{background:#fde6e5;color:var(--bad)}
.cc .by{font-size:.72rem;color:var(--gr);margin-top:auto}
.sect{font-size:1.15rem;font-weight:800;margin:1.2rem 0 .6rem}
.det{display:grid;grid-template-columns:1fr 1.5fr;gap:1.4rem;align-items:start}
.dcard{background:#fff;border-radius:28px;border:2px solid var(--line);padding:1.6rem;box-shadow:var(--sh)}
.dcard .ic{font-size:5rem;line-height:1}
.dcard h1{font-size:1.8rem;font-weight:800;line-height:1.15;margin:.5rem 0}
.dcard .see{font-size:1.05rem;color:var(--gr);line-height:1.45}
.tags{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.tag{background:#eef6f8;color:var(--tl-d);border-radius:99px;padding:.3rem .8rem;font-size:.82rem;font-weight:600}
.stp{display:flex;gap:1rem;align-items:center;background:#fff;border:2px solid var(--line);border-radius:22px;padding:1rem 1.2rem;margin-bottom:.8rem;box-shadow:var(--sh)}
.stp .n{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--tl2);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:1.2rem}
.stp .si{font-size:2.6rem;flex:none}.stp p{font-size:1.15rem;line-height:1.35;font-weight:500}
.alert{display:flex;gap:1rem;align-items:center;background:#fde6e5;border:2px solid var(--bad);color:#8f2420;border-radius:var(--r);padding:.9rem 1.2rem;margin-bottom:.9rem;font-weight:600}
.alert .big{font-size:2rem}
.alert.info{background:#fff3da;border-color:var(--warn);color:#7a5600}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1rem}
.fb .btn{flex-direction:column;padding:1rem;font-size:1.05rem;gap:.2rem}.fb .btn span{font-size:2.4rem}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:1.2rem 1.4rem;box-shadow:var(--sh)}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea,.ta{padding:.8rem 1rem;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1rem;width:100%}
textarea{resize:vertical;min-height:7rem}
.pick{display:flex;gap:.5rem;flex-wrap:wrap}
.pk{padding:.7rem 1.1rem;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:.95rem;display:inline-flex;gap:.4rem;align-items:center}
.pk.on{background:var(--tl2);border-color:var(--tl2);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.stepper{display:inline-flex;align-items:center;gap:.6rem}
.stepper button{width:2.6rem;height:2.6rem;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:1.4rem;font-weight:700}
.stepper b{min-width:4.5rem;text-align:center;font-size:1.1rem}
.paro{display:flex;align-items:center;gap:.8rem;background:#f8fbfc;border:2px solid var(--line);border-radius:14px;padding:.5rem .9rem;margin-top:.5rem;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:1.1rem}
.kpi{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem;box-shadow:var(--sh)}
.kpi small{color:var(--gr);font-weight:600;font-size:.78rem;display:block}.kpi b{font-size:2.3rem;font-weight:800;line-height:1.1;display:block}.kpi em{font-style:normal;font-size:.75rem;color:var(--gr)}
.panel3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1rem;margin-bottom:1rem}
.bar{display:flex;align-items:center;gap:.6rem;margin:.45rem 0;font-size:.85rem}
.bar .lb{width:11rem;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar .tr{flex:1;background:#f3ece2;border-radius:99px;height:1.1rem;overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:var(--c,var(--or))}
.bar .vl{width:2.4rem;text-align:right;font-weight:700}
.cols{display:flex;align-items:flex-end;gap:3px;height:7rem;margin-top:.5rem}
.cols div{flex:1;background:var(--tl);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.cols div span{position:absolute;bottom:-1.3rem;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--gr)}
.feed{max-height:21rem;overflow:auto}
.fi{display:flex;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.85rem;align-items:flex-start}
.fi .e{font-size:1.3rem}.fi time{margin-left:auto;color:var(--gr);font-size:.75rem;white-space:nowrap}
.health{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;font-size:.85rem}
.health div{background:#f8fbfc;border-radius:12px;padding:.6rem .8rem}.health b{display:block;font-size:1rem}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.toolbar select{padding:.55rem .9rem;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(30,34,36,.62);z-index:50;display:grid;place-items:center;padding:1.5rem}
.modal{background:#fff;border-radius:30px;max-width:56rem;width:100%;max-height:92vh;overflow:auto;padding:2rem 2.2rem;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h2{font-size:1.6rem;font-weight:800;margin-bottom:.4rem}
.tut{text-align:center}
.tut .big{font-size:6.5rem;line-height:1.1;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.tut h2{font-size:2rem}.tut p{font-size:1.2rem;color:var(--gr);margin:.5rem 0 1.2rem}
.dots{display:flex;gap:.5rem;justify-content:center;margin:1rem 0}.dots i{width:.8rem;height:.8rem;border-radius:50%;background:#e5ddd2}.dots i.on{background:var(--or)}
.toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.9rem 1.6rem;border-radius:99px;z-index:70;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.spin{display:inline-block;width:1.2rem;height:1.2rem;border:3px solid #b9eaf1;border-top-color:var(--tl2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--gr)}.small{font-size:.8rem}
footer{padding:.8rem 1.8rem;text-align:center;font-size:.75rem;color:var(--gr)}
@media (max-width:1100px){.tiles,.det,.two,.panel3,.how{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}header.top{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
'use strict';
/* ====================== utilidades ====================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]/g, ' ');
const AREA_COLOR = {'Impresión':'#EE7623','Sellado':'#B15E14','Extrusión':'#00BED6','Laminado':'#008AAB','Conversión':'#E99B35','Termoformado':'#00758D','Fundas':'#53575A','Otra':'#7a8a90'};
const AREAS = Object.keys(AREA_COLOR);
const MAQUINAS = ['Extrusora','Impresora flexográfica','Laminadora','Selladora / conversión','Termoformadora','Línea de fundas'];
const fmtT = ts => new Date(ts).toLocaleTimeString('es-CO', {hour: '2-digit', minute: '2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('es-CO', {day: '2-digit', month: 'short'});
const turnoActual = () => { const h = new Date().getHours(); return h >= 6 && h < 14 ? 'A' : h >= 14 && h < 22 ? 'B' : 'C'; };

/* ====================== estado ====================== */
const DEF_CFG = {apiKey: '', model: 'claude-haiku-5-5', cloudUrl: '', cloudSecret: '', pin: '1234', voz: true, sesion: 'Sesión demo', tutorialVisto: false};
const S = {
  view: 'home', p: {},
  cfg: Object.assign({}, DEF_CFG, LS.get('al_cfg', {})),
  casos: [],
  eventos: LS.get('m_eventos', []),
  outbox: LS.get('m_outbox', []),
  userCasos: LS.get('m_casos_user', []),
  operario: LS.get('m_operario', ''),
  turno: turnoActual(),
  lider: false,
  cloud: {ok: null, last: null},
  ia: {ok: null},
  tmp: {}
};
const saveCfg = () => LS.set('al_cfg', S.cfg);

/* ====================== casos ====================== */
function seedCasos() { try { return JSON.parse($('#seed-casos').textContent); } catch (e) { return []; } }
async function loadCasos() {
  const map = new Map();
  seedCasos().forEach(c => map.set(c.id, c));
  if (location.protocol !== 'file:') try { const r = await fetch('casos.json', {cache: 'no-store'}); if (r.ok) (await r.json()).forEach(c => map.set(c.id, c)); } catch (e) {}
  if (S.cfg.cloudUrl && S.cfg.cloudSecret) {
    try {
      const r = await fetch(S.cfg.cloudUrl + '?action=casos&secret=' + encodeURIComponent(S.cfg.cloudSecret));
      const j = await r.json();
      if (j.ok) { (j.casos || []).forEach(c => map.set(c.id, c)); S.cloud.ok = true; }
    } catch (e) { S.cloud.ok = false; }
  }
  S.userCasos.forEach(c => map.set(c.id, c));
  S.casos = [...map.values()];
}
const casoById = id => S.casos.find(c => c.id === id);
function ayudoCount(id) { return S.eventos.filter(e => e.tipo === 'resultado' && e.caso_id === id && (e.ok === 'si' || e.ok === 'mas') && !e.ejemplo).length; }

/* ====================== eventos + nube ====================== */
function logEvent(e) {
  const ev = Object.assign({id: uid(), ts: new Date().toISOString(), sesion: S.cfg.sesion, operario: S.operario || '', turno: S.turno, ejemplo: false}, e);
  S.eventos.push(ev);
  if (S.eventos.length > 4000) S.eventos = S.eventos.slice(-4000);
  LS.set('m_eventos', S.eventos);
  if (!ev.ejemplo) queue('evento', ev);
  return ev;
}
function queue(kind, data) { S.outbox.push({kind, data}); LS.set('m_outbox', S.outbox); clearTimeout(queue.t); queue.t = setTimeout(syncNow, 1200); }
async function syncNow() {
  if (!(S.cfg.cloudUrl && S.cfg.cloudSecret) || !S.outbox.length) { paintStatus(); return; }
  const batch = S.outbox.slice(0, 40);
  try {
    const r = await fetch(S.cfg.cloudUrl, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({secret: S.cfg.cloudSecret, items: batch})});
    const j = await r.json();
    if (j.ok) { S.outbox = S.outbox.slice(batch.length); LS.set('m_outbox', S.outbox); S.cloud = {ok: true, last: Date.now()}; if (S.outbox.length) setTimeout(syncNow, 300); }
    else S.cloud.ok = false;
  } catch (e) { S.cloud.ok = false; }
  paintStatus();
}
setInterval(syncNow, 30000);

/* ====================== IA (Claude) ====================== */
const hasIA = () => !!S.cfg.apiKey;
async function claude(system, user, maxTokens = 700) {
  const t0 = performance.now();
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'content-type': 'application/json', 'x-api-key': S.cfg.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: S.cfg.model, max_tokens: maxTokens, system, messages: [{role: 'user', content: user}]})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
    const txt = (j.content || []).map(b => b.text || '').join('');
    S.ia.ok = true; paintStatus();
    logEvent({tipo: 'ia', ok: 'si', ms: Math.round(performance.now() - t0), detalle: 'ok'});
    return txt;
  } catch (err) {
    S.ia.ok = false;
    logEvent({tipo: 'ia', ok: 'no', ms: Math.round(performance.now() - t0), detalle: String(err.message || err).slice(0, 120)});
    paintStatus();
    throw err;
  }
}
function parseJSON(t) { const m = String(t).match(/\{[\s\S]*\}/); if (!m) throw new Error('sin JSON'); return JSON.parse(m[0]); }
const baseCompacta = () => JSON.stringify(S.casos.map(c => ({id: c.id, titulo: c.titulo, area: c.area, sintoma: c.sintoma, pasos: c.pasos.map(p => p.texto)})));
const SYS_BASE = 'Eres Maestro, el asistente de voz de la planta de Alico (empaques flexibles, Medellín). Hablas con operarios con poco contacto con tecnología: frases cortas, palabras simples, tono cercano y respetuoso, sin tecnicismos. Nunca inventes valores de temperatura, presión ni tiempos: remite a «la ficha» o al líder. Si hay riesgo para la calidad del producto o la seguridad, indica llamar al líder. Responde SOLO con JSON válido.';

async function iaResponder(texto) {
  const out = await claude(SYS_BASE,
    `BASE DE CASOS:\n${baseCompacta()}\n\nEl operario dice: "${texto}"\n\nDevuelve JSON: {"caso_id": id de la base que mejor aplica o null, "respuesta": máximo 55 palabras, explicando qué hacer en pasos simples, "llamar_lider": true/false}`);
  return parseJSON(out);
}
async function iaEstructurar(texto, caso) {
  const out = await claude(SYS_BASE,
    `Un operario cuenta cómo resolvió un problema${caso ? ' parecido al caso «' + caso.titulo + '»' : ''}. Convierte su relato en una ficha clara.\nRelato: "${texto}"\nDevuelve JSON: {"titulo": máx 7 palabras, "area": una de ${JSON.stringify(AREAS)}, "icono": un emoji, "sintoma": una frase, "causa": una frase, "pasos": lista de 2 a 4 pasos cortos (verbo al inicio), "critico": true si afecta calidad crítica o seguridad}`, 600);
  return parseJSON(out);
}
async function iaTurno(datos) {
  const out = await claude(SYS_BASE,
    `Resume el cambio de turno para el siguiente operario. Datos: ${JSON.stringify(datos)}\nDevuelve JSON: {"audio": texto para leer en voz alta, máximo 55 palabras, cálido y claro, "alertas": lista de máximo 3 frases cortas, "pendientes": lista de máximo 3 frases cortas, "causa_principal": una frase o ""}`, 600);
  return parseJSON(out);
}

/* ====================== búsqueda local (sin IA) ====================== */
function buscarLocal(texto) {
  const q = norm(texto).split(/\s+/).filter(w => w.length > 2);
  if (!q.length) return [];
  return S.casos.map(c => {
    const hay = norm([c.titulo, c.sintoma, c.claves, c.area].join(' '));
    let s = 0;
    q.forEach(w => { if (hay.includes(w)) s += w.length > 4 ? 2 : 1; });
    return {c, s};
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.c);
}
const ICO_PASO = [[/temperatur|calor|calient/, '🌡️'], [/limpi|sucio|residu/, '🧽'], [/revis|mir|veri|compar|observ/, '🔍'], [/ajust|calibr|regul/, '⚙️'], [/med|espesor/, '📏'], [/cambi|reempl/, '🔁'], [/avis|llam|inform/, '📣'], [/espera|minut|tiempo/, '⏱️']];
const icoPaso = t => (ICO_PASO.find(([r]) => r.test(norm(t))) || [0, '👉'])[1];
function estructurarLocal(texto, caso) {
  const partes = String(texto).split(/[.;\n]+|\s+y luego\s+|\s+después\s+|\s+luego\s+/i).map(s => s.trim()).filter(s => s.length > 3).slice(0, 4);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  return {
    titulo: caso ? caso.titulo : cap(String(texto).split(/\s+/).slice(0, 6).join(' ')),
    area: caso ? caso.area : 'Otra', icono: caso ? caso.icono : '💡',
    sintoma: caso ? caso.sintoma : '', causa: '',
    pasos: (partes.length ? partes : [texto]).map(cap), critico: !!(caso && caso.critico)
  };
}
function turnoLocal(d) {
  const paros = d.paros.reduce((a, p) => a + p.min, 0);
  const partes = [`Turno ${d.turno}, ${d.maquina}.`];
  if (d.paros.length) partes.push(`Hubo ${d.paros.length} paro${d.paros.length > 1 ? 's' : ''}, ${paros} minutos en total.`);
  if (d.pendientes.length) partes.push('Queda pendiente: ' + d.pendientes.join(', ') + '.');
  if (d.texto) partes.push(d.texto);
  return {audio: partes.join(' ').split(/\s+/).slice(0, 70).join(' '), alertas: d.paros.slice(0, 3).map(p => `Paro de ${p.min} min por ${p.causa}`), pendientes: d.pendientes.slice(0, 3), causa_principal: d.paros[0]?.causa || ''};
}

/* ====================== voz ====================== */
let rec = null;
function startListen(opts) {
  stopListen();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Este navegador no escucha. Usa Chrome o Edge, o escribe con el teclado.'); return false; }
  rec = new SR(); rec.lang = 'es-CO'; rec.interimResults = true; rec.continuous = !!opts.continuous;
  let fin = '';
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript; }
    opts.onText && opts.onText((fin + interim).trim());
  };
  rec.onerror = ev => { if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('No te escuché bien. ¿Probamos otra vez?'); };
  rec.onend = () => { rec = null; opts.onEnd && opts.onEnd(fin.trim()); };
  try { rec.start(); } catch (e) { return false; }
  return true;
}
function stopListen() { if (rec) { try { rec.stop(); } catch (e) {} } }
function say(t) {
  if (!S.cfg.voz || !('speechSynthesis' in window)) return;
  try {
    AL.hablar(t);
  } catch (e) {}
}
function toast(m, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

/* ====================== navegación ====================== */
function go(view, p = {}) { stopListen(); try { speechSynthesis.cancel(); } catch (e) {} S.view = view; S.p = p; render(); window.scrollTo(0, 0); }
function guide(ico, title, sub, step) {
  const bar = step ? `<div class="steps-bar" aria-label="Paso ${step} de 3">${[1, 2, 3].map(n => `<i class="${n < step ? 'done' : n === step ? 'on' : ''}">${n < step ? '✓' : n}</i>`).join('')}</div>` : '';
  return `<div class="guide"><div class="gi">${ico}</div><div><b>${title}</b><span>${sub}</span></div>${bar}</div>`;
}
const backBtn = (to = 'home') => `<button class="btn gr back" data-act="${to === 'home' ? 'home' : 'go'}" data-to="${to}">← Volver</button>`;

function paintStatus() {
  const ia = $('#st-ia'), cl = $('#st-cloud'); if (!ia) return;
  ia.className = 'chip ' + (!hasIA() ? 'warn' : S.ia.ok === false ? 'bad' : 'ok');
  ia.textContent = !hasIA() ? '🤖 IA: modo botones' : S.ia.ok === false ? '🤖 IA: sin respuesta' : '🤖 IA conectada';

/* ---- Historia de 2 años (EJEMPLO, determinista): da contexto a lo que pasa hoy ---- */
let HIST = null;
const MAQS = {'Impresión': 'Impresora flexográfica FX-02', 'Sellado': 'Selladora-cortadora SC-03', 'Extrusión': 'Extrusora EX-01', 'Laminado': 'Laminadora LM-01', 'Conversión': 'Selladora-cortadora SC-03', 'Termoformado': 'Termoformadora TF-01', 'Fundas': 'Línea de fundas termoencogibles'};
function historia() {
  if (HIST) return HIST;
  const r = AL.rng(730), ops = (window.PLANTA ? PLANTA.OPERARIOS : ['Carlos', 'Marta', 'Jhon', 'Luz', 'Andrés', 'Paola']), out = [], hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const ids = S.casos.filter(c => c.ejemplo).map(c => c.id), base = {'sello-abierto': 12, 'tinta-corrida': 9, 'color-diferente': 6, 'registro': 5, 'fuga': 5, 'ojos-de-pez': 4, 'espesor': 4, 'delaminacion': 5, 'zipper-valvula': 4, 'bandeja': 5, 'sleeve': 3};
  const add = e => out.push(Object.assign({id: 'h' + out.length, sesion: 'Histórico 2 años', ejemplo: true, hist: true}, e));
  for (let d = 730; d >= 1; d--) {
    const dia = new Date(hoy - d * 864e5), m = dia.getMonth(), prog = (730 - d) / 730;               // prog: 0 hace dos años → 1 ayer
    const adop = .35 + .65 * Math.min(1, prog * 1.6), temporada = m >= 9 ? 1.3 : m <= 1 ? .85 : 1, dom = dia.getDay() === 0 ? .3 : 1;
    const n = Math.round(14 * adop * temporada * dom * (.75 + r() * .5)), pResuelve = .6 + .25 * prog;
    const bag = []; ids.forEach(id => { let w = base[id] || 3; if (id === 'tinta-corrida' && prog > .55) w *= .45; if (id === 'bandeja' && prog > .7) w *= 1.8; if (id === 'sello-abierto' && m >= 9) w *= 1.4; for (let k = 0; k < w; k++) bag.push(id); });
    for (let i = 0; i < n; i++) {
      const id = bag[Math.floor(r() * bag.length)], c = casoById(id); if (!c) continue;
      const h = Math.floor(r() * 24), ts = dia.getTime() + h * 36e5 + Math.floor(r() * 36e5), turno = h >= 6 && h < 14 ? 'A' : h >= 14 && h < 22 ? 'B' : 'C';
      const op = ops[Math.floor(r() * ops.length)], pr = pResuelve - (turno === 'C' ? .1 : 0), x = r(), ok = x < pr ? 'si' : x < pr + .14 ? 'mas' : 'no';
      add({ts: new Date(ts).toISOString(), tipo: 'consulta', caso_id: id, area: c.area, via: r() > .45 ? 'voz' : 'boton', operario: op, turno, detalle: c.titulo, maquina: MAQS[c.area]});
      add({ts: new Date(ts + 3e5).toISOString(), tipo: 'resultado', caso_id: id, area: c.area, ok, operario: op, turno});
      if (ok === 'no') add({ts: new Date(ts + 3.2e5).toISOString(), tipo: 'escalamiento', caso_id: id, area: c.area, operario: op, turno, detalle: 'No funcionó', maquina: MAQS[c.area]});
      if (ok !== 'si' && r() < .45) add({ts: new Date(ts + 2e5).toISOString(), tipo: 'paro', min: Math.round(10 + r() * (60 - 25 * prog)), detalle: c.titulo + ' · ' + MAQS[c.area], caso_id: id, area: c.area, operario: op, turno, maquina: MAQS[c.area]});
    }
    if (r() < .06 * adop) add({ts: new Date(dia.getTime() + 15 * 36e5).toISOString(), tipo: 'truco', detalle: 'Truco aportado por un operario', operario: ops[Math.floor(r() * ops.length)], turno: 'B'});
  }
  HIST = out; return out;
}

  });
  add({ts: new Date(now - 2 * 3600e3).toISOString(), tipo: 'truco', detalle: 'Limpiar la barra con alcohol antes de arrancar', operario: 'Carlos', turno: 'A'});
  add({ts: new Date(now - 5 * 3600e3).toISOString(), tipo: 'turno', operario: 'Marta', turno: 'C', detalle: 'Turno C, Selladora. Hubo un paro de 40 minutos por sello abierto. Quedó pendiente limpiar la barra de sellado. Revisen el sello cada hora.'});
  S.eventos.sort((a, b) => a.ts.localeCompare(b.ts)); LS.set('m_eventos', S.eventos);
}

/* ====================== acciones ====================== */
function act_buscar() { const v = $('#q').value; consultar(v, 'texto'); if (!hasIA()) { S.tmp.q = v; render(); const loc = buscarLocal(v); $('#heard').innerHTML = `<div class="heard"><span style="font-size:1.6rem">🔎</span><div>Buscando: «${esc(v)}»</div></div>`; } }
const A = {
  home: () => { S.tmp = {}; go('home'); },
  go: (d) => { if (d.to === 'problema' || d.to === 'panel') {} if (d.to === 'ensenar' || d.to === 'turno') { if (d.to === 'ensenar') S.tmp.ens = null; } go(d.to); },
  tutorial: () => tutorial(0), ajustes, close: closeModal,
  ov: (d, el, ev) => { if (ev.target === el) closeModal(); },
  tut: d => tutorial(+d.i), 'tut-fin': () => { closeModal(); S.cfg.tutorialVisto = true; saveCfg(); },
  caso: d => go('caso', {id: d.id, via: (d.via || S.tmp.q) ? 'ya' : 'boton'}),
  say: d => say(d.t),
  'say-caso': d => { const c = casoById(d.id); say(`${c.titulo}. ${c.pasos.map((p, i) => 'Paso ' + (i + 1) + '. ' + p.texto).join(' ')} ${c.critico ? 'Avisa a tu líder.' : ''}`); },
  'say-nota': () => { const n = S.eventos.filter(e => e.tipo === 'turno').slice(-1)[0]; n && say(n.detalle); },
  buscar: act_buscar,
  'mic-problema': () => micToggle(t => consultar(t, 'voz'), {live: txt => { $('#heard').innerHTML = `<div class="heard"><span style="font-size:1.6rem">🎤</span><div><i>${esc(txt || 'Te escucho…')}</i></div></div>`; }}),
  'mic-ensenar': () => micToggle(t => { S.tmp.ens.texto = t; $('#txt').value = t; }, {live: t => { $('#txt').value = t; }}),
  'mic-turno': () => micToggle(t => { S.tmp.tur.texto = t; $('#txt').value = t; }, {continuous: true, live: t => { $('#txt').value = t; }}),
  res: d => {
    const c = casoById(d.id);
    logEvent({tipo: 'resultado', caso_id: c.id, area: c.area, ok: d.ok, detalle: c.titulo});
    if (d.ok === 'no' || (c.critico && d.ok !== 'si')) logEvent({tipo: 'escalamiento', caso_id: c.id, area: c.area, detalle: 'Aviso al líder'});
    if (d.ok === 'si') {
      openModal(`<div class="tut"><div class="big">🎉</div><h2>¡Buen trabajo!</h2><p>Gracias por contarnos. ¿Hiciste algo distinto que quieras enseñar a tus compañeros?</p><div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap"><button class="btn lg" data-act="to-ens" data-id="${esc(c.id)}">💡 Sí, quiero enseñar</button><button class="btn gr" data-act="fin-res">No, volver al inicio</button></div></div>`);
      say('Buen trabajo. Gracias por contarnos.');
    } else if (d.ok === 'mas') {
      openModal(`<div class="tut"><div class="big">🤝</div><h2>Gracias por decirnos</h2><p>Si quedó a medias, avisa a tu líder. Y si encontraste algo que ayuda, enséñalo.</p><div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap"><button class="btn lg" data-act="to-ens" data-id="${esc(c.id)}">💡 Enseñar lo que hice</button><button class="btn gr" data-act="fin-res">Volver al inicio</button></div></div>`);
    } else {
      openModal(`<div class="tut"><div class="big">📣</div><h2>Ya avisamos a tu líder</h2><p>Quédate con la máquina segura. Tu líder verá el caso en el panel con todo lo que hiciste.</p><div style="display:flex;gap:.8rem;justify-content:center"><button class="btn lg" data-act="fin-res">Entendido</button></div></div>`);
      say('Ya avisamos a tu líder.');
    }
  },
  'to-ens': d => { closeModal(); S.tmp.ens = {caso: d.id, texto: '', ficha: null}; go('ensenar', {caso: d.id}); },
  'fin-res': () => { closeModal(); S.tmp = {}; go('home'); },
  /* enseñar */
  'ens-caso': d => { const t = S.tmp.ens; t.caso = d.id; t.ficha = null; render(); },
  'ens-organizar': async () => {
    const t = S.tmp.ens; t.texto = $('#txt').value.trim();
    if (t.texto.length < 8) { toast('Cuéntame un poquito más: ¿qué hiciste?'); return; }
    const c = t.caso && casoById(t.caso);
    $('#preview').innerHTML = `<div class="ans"><span class="spin"></span> Organizando tu truco…</div>`;
    try { t.ficha = hasIA() ? await iaEstructurar(t.texto, c) : estructurarLocal(t.texto, c); }
    catch (e) { toast('La IA no respondió; lo organicé yo.'); t.ficha = estructurarLocal(t.texto, c); }
    t.ficha.pasos = (t.ficha.pasos || []).slice(0, 4);
    $('#preview').innerHTML = previewFicha(t.ficha); $('#preview').scrollIntoView({behavior: 'smooth'});
  },
  'ens-oir': () => { const f = S.tmp.ens.ficha; say(`Tu truco: ${f.titulo}. ${f.pasos.map((p, i) => 'Paso ' + (i + 1) + '. ' + p).join(' ')} ¿Está bien así?`); },
  'ens-corregir': () => { S.tmp.ens.ficha = null; render(); },
  'ens-guardar': () => {
    const t = S.tmp.ens, f = t.ficha, c = t.caso && casoById(t.caso);
    if (!S.operario.trim()) { toast('Escribe tu nombre para darte el crédito 🙂'); $('#nom').focus(); return; }
    const caso = {id: 'u-' + uid(), area: AREAS.includes(f.area) ? f.area : 'Otra', icono: f.icono || '💡', titulo: f.titulo, sintoma: f.sintoma || '', claves: norm(t.texto), causas: f.causa ? [f.causa] : [],
      pasos: f.pasos.map(p => ({ico: icoPaso(p), texto: p})), llamar_lider: '', critico: !!f.critico, autor: S.operario.trim(), ejemplo: false, estado: 'pendiente', variante_de: c?.id || '', ts: new Date().toISOString()};
    S.userCasos.push(caso); LS.set('m_casos_user', S.userCasos); S.casos.push(caso); queue('caso', caso);
    logEvent({tipo: 'truco', caso_id: caso.id, area: caso.area, detalle: caso.titulo});
    S.tmp = {};
    openModal(`<div class="tut"><div class="big">🌟</div><h2>¡Gracias, ${esc(S.operario.split(' ')[0])}!</h2><p>Tu truco «${esc(caso.titulo)}» ya está en la memoria de la planta. Cuando el líder lo valide, lo verán todos con tu nombre.</p><button class="btn ok lg" data-act="fin-res">Volver al inicio</button></div>`);
    say('Gracias. Tu truco ya está en la memoria de la planta.');
  },
  /* turno */
  'tur-turno': d => { S.turno = d.k; render(); },
  'tur-maq': d => { S.tmp.tur.maquina = d.m; render(); },
  'tur-pend': d => { const a = S.tmp.tur.pend, i = a.indexOf(d.x); i >= 0 ? a.splice(i, 1) : a.push(d.x); render(); },
  'tur-causa': d => { S.tmp.tur.causa = d.c; render(); },
  'tur-min': d => { const t = S.tmp.tur; t.min = Math.max(5, Math.min(240, t.min + +d.d)); $('#minv').textContent = t.min + ' min'; },
  'tur-addparo': () => { const t = S.tmp.tur; if (!t.causa) { toast('Primero elige la causa del paro.'); return; } t.paros.push({causa: t.causa, min: t.min}); t.causa = ''; render(); },
  'tur-delparo': d => { S.tmp.tur.paros.splice(+d.i, 1); render(); },
  'tur-resumir': async () => {
    const t = S.tmp.tur; t.texto = $('#txt').value.trim();
    if (!t.paros.length && !t.pend.length && t.texto.length < 5) { toast('Marca algo o cuéntame cómo quedó el turno.'); return; }
    const datos = {turno: S.turno, maquina: t.maquina, paros: t.paros, pendientes: t.pend.map(x => x.replace(/^\S+\s/, '')), texto: t.texto};
    $('#preview').innerHTML = `<div class="ans"><span class="spin"></span> Armando el audio…</div>`;
    try { t.res = hasIA() ? await iaTurno(datos) : turnoLocal(datos); } catch (e) { toast('La IA no respondió; armé el resumen yo.'); t.res = turnoLocal(datos); }
    $('#preview').innerHTML = previewTurno(t.res); $('#preview').scrollIntoView({behavior: 'smooth'}); say(t.res.audio);
  },
  'tur-guardar': () => {
    const t = S.tmp.tur;
    t.paros.forEach(p => logEvent({tipo: 'paro', min: p.min, detalle: `${p.causa} · ${t.maquina}`}));
    const ev = logEvent({tipo: 'turno', detalle: t.res.audio, area: '', via: 'voz'});
    queue('turno', {id: ev.id, ts: ev.ts, sesion: ev.sesion, operario: ev.operario, turno: ev.turno, maquina: t.maquina, paros_min: t.paros.reduce((a, p) => a + p.min, 0), resumen_audio: t.res.audio, alertas: t.res.alertas, pendientes: t.res.pendientes, texto_original: t.texto});
    S.tmp = {};
    openModal(`<div class="tut"><div class="big">📻</div><h2>Turno entregado</h2><p>El siguiente turno escuchará tu nota apenas abra Maestro. ¡Buen descanso!</p><button class="btn ok lg" data-act="fin-res">Volver al inicio</button></div>`);
  },
  /* panel */
  'seed-demo': () => { seedDemo(); S.tmp.pf = {rango: '7d', ejemplo: true, sesion: ''}; toast('Datos de EJEMPLO cargados.'); render(); },
  'borrar-ej': () => { S.eventos = S.eventos.filter(e => !e.ejemplo); LS.set('m_eventos', S.eventos); toast('Datos de ejemplo borrados.'); render(); },
  'borrar-key': () => { S.cfg.apiKey = ''; saveCfg(); closeModal(); paintStatus(); toast('Clave borrada de este equipo.'); },
  lider: () => {
    if (S.lider) { S.lider = false; render(); return; }
    openModal(`<div class="tut"><div class="big">🔒</div><h2>Modo líder</h2><p>Escribe el PIN para validar trucos.</p><div class="field" style="max-width:16rem;margin:0 auto 1rem"><input id="pin" type="password" inputmode="numeric" style="text-align:center;font-size:1.6rem"></div><div style="display:flex;gap:.8rem;justify-content:center"><button class="btn lg" data-act="pin-ok">Entrar</button><button class="btn gr" data-act="close">Cancelar</button></div></div>`);
    setTimeout(() => $('#pin') && $('#pin').focus(), 50);
  },
  'pin-ok': () => { if ($('#pin').value === S.cfg.pin) { S.lider = true; closeModal(); render(); } else toast('PIN incorrecto.'); },
  validar: d => {
    const c = casoById(d.id); c.estado = 'validado'; const i = S.userCasos.findIndex(x => x.id === c.id); if (i >= 0) S.userCasos[i] = c; LS.set('m_casos_user', S.userCasos);
    queue('caso', c); logEvent({tipo: 'validacion', caso_id: c.id, area: c.area, detalle: c.titulo}); render();
  },
  rechazar: d => {
    S.casos = S.casos.filter(x => x.id !== d.id); S.userCasos = S.userCasos.filter(x => x.id !== d.id); LS.set('m_casos_user', S.userCasos);
    queue('caso', Object.assign({}, casoById(d.id) || {id: d.id}, {id: d.id, estado: 'rechazado'})); render();
  },
  diag: async () => {
    const box = $('#diag'), m = metricas(filtrarEventos());
    if (!hasIA()) { box.innerHTML = '<p class="small muted">Conecta la clave de la IA en Ajustes para pedir un diagnóstico.</p>'; return; }
    box.innerHTML = '<span class="spin"></span> Analizando…';
    const resumen = {consultas: m.cons.length, resueltas_pct: m.res.length ? Math.round(m.si / m.res.length * 100) : null, avisos_lider: m.escal, minutos_paro: m.minParo, top: Object.entries(m.porCaso).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => [casoById(id)?.titulo, n]), por_turno: m.porTurno};
    try { const t = await claude('Eres analista de operaciones de una planta de empaques. Escribe en español claro para un gerente de planta. 4 viñetas cortas: qué ves, dónde está el riesgo, qué acción tomar hoy, qué medir mañana. No inventes datos que no estén.', JSON.stringify(resumen), 450); box.innerHTML = `<div class="small" style="white-space:pre-wrap;line-height:1.5">${esc(t)}</div>`; }
    catch (e) { box.innerHTML = '<p class="small" style="color:var(--bad)">No pude consultar la IA.</p>'; }
  },
  'export-csv': () => {
    const cols = ['id', 'ts', 'sesion', 'tipo', 'caso_id', 'area', 'via', 'ok', 'ms', 'min', 'operario', 'turno', 'detalle', 'ejemplo'];
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    descargar('maestro-eventos.csv', 'text/csv', '﻿' + [cols.join(','), ...S.eventos.map(e => cols.map(c => q(e[c])).join(','))].join('\n'));
  },
  'export-casos': () => descargar('casos.json', 'application/json', JSON.stringify(S.casos, null, 2)),
  'save-cfg': () => { readCfg(); closeModal(); paintStatus(); loadCasos().then(() => { paintStatus(); render(); }); syncNow(); toast('Ajustes guardados.'); },
  'test-ia': async () => { readCfg(); const r = $('#a-res'); r.innerHTML = '<span class="spin"></span> Probando…'; try { const t = await claude('Responde solo con la palabra OK.', 'Prueba', 10); r.innerHTML = '✅ La IA respondió: ' + esc(t.trim().slice(0, 40)); } catch (e) { r.innerHTML = '❌ ' + esc(e.message); } paintStatus(); },
  'test-cloud': async () => { readCfg(); const r = $('#a-res'); r.innerHTML = '<span class="spin"></span> Probando…'; try { const x = await fetch(S.cfg.cloudUrl + '?action=ping&secret=' + encodeURIComponent(S.cfg.cloudSecret)); const j = await x.json(); S.cloud.ok = !!j.ok; r.innerHTML = j.ok ? '✅ Nube conectada.' : '❌ La nube respondió «' + esc(j.error || 'error') + '» (revisa la clave).'; } catch (e) { S.cloud.ok = false; r.innerHTML = '❌ No pude llegar a la URL.'; } paintStatus(); }
};
function descargar(nombre, tipo, txt) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: tipo})); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
function micToggle(onFinal, {live, continuous} = {}) {
  const btn = $('#mic');
  if (rec) { stopListen(); return; }
  const ok = startListen({continuous, onText: t => live && live(t), onEnd: t => { btn && btn.classList.remove('on'); if (btn) btn.textContent = '🎤'; if (t) onFinal(t); }});
  if (ok && btn) { btn.classList.add('on'); btn.textContent = '⏹️'; live && live(''); }
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el, ev);
});

/* ====================== arranque ====================== */
(async function init() {
  await loadCasos();
  paintStatus(); render();
  if (!S.cfg.tutorialVisto) tutorial(0);
  syncNow();
  AL.bar({id: 'maestro', publico: 'Operarios de planta (poco contacto con sistemas) y líderes de turno', area: 'Producción · Piso de planta', iniciativa: 'Soporte técnico en planta + traspaso de turno', chips: false, narra: 'Maestro, el asistente de planta. Es para el operario que está en la máquina: toca la imagen del problema o háblale, y te guía paso a paso con dibujos y voz. Reportar un paro es tan fácil como decirlo. Cuando cambias de turno, arma el resumen para el siguiente. Y el panel de la planta muestra, con dos años de historia, qué se repite, en qué turno y cuánto tiempo se pierde.'});
  const q = decodeURIComponent((location.hash.match(/[#&]q=([^&]*)/) || [])[1] || '');
  if (q) { go('problema'); consultar(q, 'visión'); }
  window.__maestro = {S, A, logEvent, consultar};
})();
</script>
