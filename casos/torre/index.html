<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre de control de negocios · Alico</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/al.css">
<style>
svg text{font-family:Poppins,sans-serif}
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:.6rem 0;margin-bottom:.6rem}
/* diagnóstico */
.hero{display:grid;grid-template-columns:17rem 1fr auto;gap:1.6rem;align-items:center;background:linear-gradient(120deg,#00475a 0%,#00758D 55%,#008AAB 100%);color:#fff;border-radius:26px;padding:1.4rem 1.8rem;margin-bottom:1rem;box-shadow:0 12px 30px rgba(0,117,141,.25)}
.hero h2{font-size:1.55rem;font-weight:800;line-height:1.2}.hero p{opacity:.92;font-size:1rem;line-height:1.55;margin-top:.4rem}
.hero .hb{display:flex;flex-direction:column;gap:.6rem}
.gauge text{fill:#fff}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.ac{background:#fff;border:2px solid var(--line);border-radius:22px;padding:1rem 1.1rem;box-shadow:var(--sh);text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .8rem;align-items:center;position:relative;overflow:hidden;transition:transform .12s}
.ac:hover{transform:translateY(-3px);border-color:var(--tl)}
.ac::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--st)}
.ac .ic{font-size:1.8rem;grid-row:span 2}
.ac h4{font-size:.95rem;font-weight:800}.ac .k{font-size:1.45rem;font-weight:800;line-height:1.1}
.ac .k small{font-size:.75rem;font-weight:600;color:var(--gr);margin-left:.3rem}
.ac .sc{grid-row:span 2;text-align:center;font-weight:800;font-size:1.05rem;color:var(--st)}
.ac .sc small{display:block;font-size:.62rem;color:var(--gr);font-weight:600}
.ac .dx{grid-column:1/-1;font-size:.8rem;color:var(--gr);line-height:1.4;margin-top:.3rem}
.ac svg{grid-column:1/-1;width:100%;height:34px;margin-top:.2rem}
.st-g{--st:#1c9a5b}.st-y{--st:#e9a100}.st-r{--st:#d6403a}
/* tarjetas con selector de gráfico */
.vz{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem;box-shadow:var(--sh);min-width:0}
.vz .vh{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;flex-wrap:wrap}.vz .vh h3{font-size:1rem;font-weight:800;margin:0}
.vsel{margin-left:auto;display:flex;gap:2px;background:#f6efe5;border-radius:12px;padding:3px}
.vsel button{width:2rem;height:1.8rem;border-radius:9px;font-size:.85rem;background:transparent;color:var(--gr)}
.vsel button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}
.vsel button:hover{background:#fff}
.cht{width:100%;height:auto;display:block}
.hb2 .hr{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:.6rem;align-items:center;margin:.42rem 0;font-size:.84rem;font-weight:600}
.hb2 .hr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb2 .tr{height:.95rem;background:#f6efe5;border-radius:99px;overflow:hidden}.hb2 .tr i{display:block;height:100%;border-radius:99px}
.hb2 b{font-size:.84rem;min-width:3.5rem;text-align:right}
.legend{display:flex;gap:1rem;font-size:.78rem;color:var(--gr);flex-wrap:wrap;margin-top:.3rem}.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-bottom:1rem}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-bottom:1rem}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1rem;margin-bottom:1rem}
@media (max-width:1100px){.hero,.areas,.g3,.g2,.g21{grid-template-columns:1fr}}
.alc{display:flex;gap:.8rem;align-items:center;border-radius:16px;padding:.7rem 1rem;margin:.5rem 0;border:2px solid;font-size:.9rem}
.alc.r{background:#fde6e5;border-color:#f1b3b0}.alc.y{background:#fff3da;border-color:#f3d48b}.alc.g{background:#e2f6ec;border-color:#a9dfc3}
.alc b{display:block}.alc .i{font-size:1.4rem}.alc button{margin-left:auto;white-space:nowrap}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.55rem;margin:.8rem 0}
.qs button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:.7rem .95rem;text-align:left;font-weight:600;font-size:.88rem}
.qs button:hover{border-color:var(--tl);transform:translateY(-2px)}
.askrow{display:flex;gap:.6rem}.askrow input{flex:1;padding:.9rem 1.2rem;border-radius:99px;border:2px solid var(--line);font-size:1.05rem}
.mic{width:3.4rem;height:3.4rem;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1.3rem}.mic.on{background:var(--bad);border-color:var(--bad)}
.ans{margin-top:1rem}.ans .nar{font-size:1.05rem;line-height:1.55;white-space:pre-wrap;margin-bottom:.8rem}
.plan{font-size:.74rem;background:#1f2326;color:#d6f3e4;border-radius:12px;padding:.7rem .9rem;overflow:auto;max-height:11rem}
.sl2{display:grid;grid-template-columns:15rem 1fr 4.5rem;gap:.8rem;align-items:center;margin:.6rem 0;font-size:.9rem;font-weight:600}
.sl2 input{width:100%;accent-color:var(--or)}.sl2 output{font-weight:800;text-align:right}
.cov{height:.9rem;border-radius:99px;background:#f3ece2;position:relative;overflow:hidden}.cov i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.cov u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.brief{font-size:1.05rem;line-height:1.6;white-space:pre-wrap}
.prod{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .8rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
.prod .rk{width:1.7rem;height:1.7rem;border-radius:50%;background:#fff3e6;color:var(--or-d);font-weight:800;display:grid;place-items:center;font-size:.8rem}
.prod a{color:var(--ink);font-weight:700;text-decoration:none}.prod a:hover{color:var(--tl2)}
.prod small{color:var(--gr)}
.live{display:flex;gap:.6rem;align-items:center;background:#1f2326;color:#fff;border-radius:16px;padding:.6rem 1rem;margin-bottom:1rem;font-size:.9rem}
.live .dot{width:.7rem;height:.7rem;border-radius:50%;background:#2BD67B;box-shadow:0 0 0 0 #2BD67B88;animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px #2BD67B00}}
/* módulo clientes y reclamos */
.rch{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.8rem;flex-wrap:wrap}.rch h2{font-size:1.4rem;font-weight:800}
.rcf{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin-bottom:1rem}.rcf button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.5rem .4rem;text-align:center}.rcf button b{display:block;font-size:1.4rem}.rcf button small{font-size:.68rem;color:var(--gr);font-weight:600}.rcf button.on{border-color:var(--or);background:#fff4ea}
.rcg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:1rem;align-items:start}
.rct{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}.rct .inp{flex:1;min-width:9rem;border:1.5px solid var(--line);border-radius:12px;padding:.5rem .7rem;background:#fff}
.rcli{max-height:44rem;overflow:auto;display:flex;flex-direction:column;gap:.35rem}
.rci{display:grid;grid-template-columns:.6rem 1fr auto;gap:.6rem;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.6rem .7rem;font-size:.82rem}.rci.on{border-color:var(--or);box-shadow:0 0 0 3px #ee762322}.rci small{display:block;color:var(--gr);font-size:.72rem}
.sv{width:.6rem;border-radius:9px}.sv.s1{background:#d6403a}.sv.s2{background:#EE7623}.sv.s3{background:#e9a100}.sv.s4{background:#9aa5ab}
.smp{font-size:.6rem;font-weight:800;background:#f3ece0;color:#8a7b62;border-radius:99px;padding:.05rem .4rem;letter-spacing:.05em}
.est{display:inline-block;font-size:.7rem;font-weight:700;border-radius:99px;padding:.15rem .55rem;background:#eef6f8;color:var(--tl-d);white-space:nowrap}.est.e-nuevo{background:#fde6e5;color:var(--bad)}.est.e-cerrado{background:#e2f6ec;color:var(--ok)}.est.e-respondido{background:#e6f4ff;color:#1d6fb8}
.rcd{max-height:56rem;overflow:auto}.rdh{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.rdh h2{font-size:1.25rem;font-weight:800;margin-top:.1rem}
.stp{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem;margin:.8rem 0 1rem}.stp div{text-align:center;font-size:.64rem;color:#a9a9a9;font-weight:600}.stp i{display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;margin:0 auto .2rem;background:#f1ece4;font-style:normal;font-weight:800;color:#a39a8b}.stp .ok{color:var(--ok)}.stp .ok i{background:var(--ok);color:#fff}.stp .now{color:var(--or-d)}.stp .now i{background:var(--or);color:#fff;box-shadow:0 0 0 4px #ee762333}
.rcd section{margin:.7rem 0}.rcd h4{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--or-d);margin-bottom:.35rem}
.rdg{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.kv{display:flex;justify-content:space-between;gap:.6rem;font-size:.82rem;padding:.2rem 0;border-bottom:1px dashed var(--line)}.kv span{color:var(--gr)}.kv b{text-align:right;font-weight:600}
.ml{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem .6rem;border:1px solid var(--line);border-radius:12px;margin:.3rem 0;font-size:.82rem;background:#fffdf9}.ml small{display:block;color:var(--gr);font-size:.72rem}
.tl2{border-left:2px solid var(--line);margin-left:.6rem;padding-left:.9rem}.tl2 div{position:relative;margin:.45rem 0;font-size:.8rem}.tl2 span{position:absolute;left:-1.55rem;top:0;background:#fff}.tl2 small{color:var(--gr);font-size:.7rem}.tl2 p{margin:0}
.rtb{width:100%;border-collapse:collapse;font-size:.84rem}.rtb th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gr);padding:.5rem;border-bottom:2px solid var(--line)}.rtb td{padding:.5rem;border-bottom:1px solid var(--line)}.rtb tr[data-cl]{cursor:pointer}.rtb tr[data-cl]:hover td{background:#fff8f0}
@media (max-width:1100px){.rcg,.rdg{grid-template-columns:1fr}.rcf{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<script src="../../shared/al.js"></script>
<script src="../../shared/catalogo.js"></script>
<script src="../../shared/planta.js"></script>
<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="dia">🩺 Diagnóstico</button>
    <button class="tab" data-t="ven">💰 Ventas</button>
    <button class="tab" data-t="cal">🏭 Producción y calidad</button>
    <button class="tab" data-t="dis">🚚 Distribución</button>
    <button class="tab" data-t="cad">📦 Cadena de suministro</button>
    <button class="tab" data-t="cli">🎧 Clientes y reclamos</button>
    <button class="tab" data-t="sim">🎛️ Simulador</button>
    <button class="tab" data-t="ask">💬 Pregúntale a tus datos</button>
    <span class="sp"></span><span class="sample" style="align-self:center">PRODUCTOS REALES · CIFRAS DE EJEMPLO</span>
  </div>
  <section id="v-dia"></section><section id="v-ven" hidden></section><section id="v-cal" hidden></section><section id="v-dis" hidden></section><section id="v-cad" hidden></section><section id="v-cli" hidden></section><section id="v-sim" hidden></section><section id="v-ask" hidden></section>
</main>
<script src="data.js"></script>
<script>
(() => {
'use strict';
const $ = AL.$, esc = AL.esc, $$ = s => [...document.querySelectorAll(s)], D = window.TD, PL = window.PLANTA;
const COL = ['#EE7623', '#008AAB', '#E99B35', '#00BED6', '#B15E14', '#53575A', '#8E5BD6', '#1c9a5b', '#d6403a'];
const mm = v => '$' + AL.fmt(v) + ' M', pc = v => (v * 100).toFixed(1) + '%', f1 = v => AL.fmt(v);
const sum = (rows, f) => rows.reduce((s, x) => s + (typeof f === 'function' ? f(x) : x[f]), 0);
const last = D.M[11].k, prev = D.M[10].k, V = k => D.ventas.filter(x => x.mes === k), ML = D.M.map(m => m.l);
const tienda = h => 'https://alicoempaques.com/products/' + h;

/* ============================ gráficos: el usuario elige el tipo ============================ */
const VT = AL.LS.get('torre_vt', {}), SPECS = {};
const TIPOS = { line: ['📈', 'Líneas'], area: ['〰️', 'Área'], bar: ['📊', 'Barras'], hbar: ['☰', 'Barras horizontales'], pie: ['🥧', 'Torta'], donut: ['🍩', 'Dona'], table: ['▦', 'Tabla'] };
function viz(id, title, spec) {
  SPECS[id] = spec; const t = VT[id] || spec.def || 'line', allow = spec.tipos || Object.keys(TIPOS);
  return `<div class="vz" id="vz-${id}"><div class="vh"><h3>${title}</h3><div class="vsel">${allow.map(k => `<button data-vz="${id}" data-ty="${k}" class="${k === t ? 'on' : ''}" title="${TIPOS[k][1]}">${TIPOS[k][0]}</button>`).join('')}</div></div><div class="vb">${draw(spec, t)}</div>${spec.nota ? `<p class="small muted" style="margin-top:.4rem">${spec.nota}</p>` : ''}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vz]'); if (!b) return;
  const id = b.dataset.vz, t = b.dataset.ty; VT[id] = t; AL.LS.set('torre_vt', VT);
  const box = $('#vz-' + id); box.querySelectorAll('.vsel button').forEach(x => x.classList.toggle('on', x === b)); box.querySelector('.vb').innerHTML = draw(SPECS[id], t);
});
function draw(s, t) {
  const fmt = s.fmt || f1;
  if (t === 'table') return `<div style="max-height:20rem;overflow:auto"><table class="tb"><tr><th>${esc(s.eje || '')}</th>${s.series.map(x => `<th>${esc(x.n)}</th>`).join('')}</tr>${s.labels.map((l, i) => `<tr><td>${esc(l)}</td>${s.series.map(x => `<td>${fmt(x.v[i])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  if (t === 'pie' || t === 'donut') {
    const parts = s.series.length === 1 ? s.labels.map((l, i) => [l, s.series[0].v[i], s.colors ? s.colors[i] : COL[i % COL.length]]) : s.series.map((x, i) => [x.n, s.pieUltimo ? x.v[x.v.length - 1] : sum(x.v, v => v), x.c || COL[i % COL.length]]);
    return pie(parts.filter(p => p[1] > 0), t === 'donut', fmt);
  }
  if (t === 'hbar') { const v = s.series.length === 1 ? s.labels.map((l, i) => [l, s.series[0].v[i], s.colors ? s.colors[i] : s.series[0].c || COL[0]]) : s.series.map((x, i) => [x.n, x.v[x.v.length - 1], x.c || COL[i]]); return hbars(v, fmt); }
  if (t === 'bar') return vbars(s.labels, s.series, fmt);
  return line(s.labels, s.series, { fmt, area: t === 'area', zero: s.zero });
}
function line(labels, series, o = {}) {
  const W = 760, H = 250, L = 56, R = 18, T = 16, B = 32, all = series.flatMap(s => s.v), mn = o.zero === false ? Math.min(...all) * .96 : Math.min(0, ...all), mx = Math.max(...all) * 1.06 || 1, n = labels.length;
  const x = i => L + i * (W - L - R) / Math.max(1, n - 1), y = v => T + (1 - (v - mn) / (mx - mn || 1)) * (H - T - B);
  const grid = [0, .25, .5, .75, 1].map(t => { const v = mn + (mx - mn) * t; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#eadfce" stroke-dasharray="3 4"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#777">${o.fmt(v)}</text>`; }).join('');
  const lb = labels.map((l, i) => (n > 8 && i % 2 && i !== n - 1) ? '' : `<text x="${x(i)}" y="${H - 9}" text-anchor="middle" font-size="11" fill="#777">${esc(l)}</text>`).join('');
  const ss = series.map((s, k) => { const c = s.c || COL[k], p = s.v.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    return `${o.area || series.length === 1 ? `<path d="${p} L${x(n - 1)} ${y(Math.max(mn, 0))} L${x(0)} ${y(Math.max(mn, 0))}Z" fill="${c}" opacity="${o.area ? .22 : .1}"/>` : ''}<path d="${p}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1)}" cy="${y(s.v[n - 1])}" r="5" fill="${c}"><title>${esc(s.n)}: ${o.fmt(s.v[n - 1])}</title></circle>`; }).join('');
  return `<svg class="cht" viewBox="0 0 ${W} ${H}">${grid}${lb}${ss}</svg>${legend(series)}`;
}
function vbars(labels, series, fmt) {
  const W = 760, H = 250, L = 56, R = 10, T = 14, B = 32, mx = Math.max(...series.flatMap(s => s.v), 0) * 1.08 || 1, n = labels.length, gw = (W - L - R) / n, bw = Math.min(26, gw * .8 / series.length);
  const y = v => T + (1 - v / mx) * (H - T - B);
  let g = [0, .5, 1].map(t => `<line x1="${L}" x2="${W - R}" y1="${y(mx * t)}" y2="${y(mx * t)}" stroke="#eadfce" stroke-dasharray="3 4"/><text x="${L - 8}" y="${y(mx * t) + 4}" text-anchor="end" font-size="11" fill="#777">${fmt(mx * t)}</text>`).join('');
  labels.forEach((l, i) => { const x0 = L + i * gw + (gw - bw * series.length) / 2; series.forEach((s, k) => { const v = s.v[i]; g += `<rect x="${x0 + k * bw}" y="${y(Math.max(0, v))}" width="${bw - 2}" height="${Math.abs(y(0) - y(v))}" rx="4" fill="${s.c || COL[k]}"><title>${esc(l)} · ${esc(s.n)}: ${fmt(v)}</title></rect>`; });
    if (!(n > 10 && i % 2 && i !== n - 1)) g += `<text x="${L + i * gw + gw / 2}" y="${H - 9}" text-anchor="middle" font-size="11" fill="#777">${esc(String(l).slice(0, 12))}</text>`; });
  return `<svg class="cht" viewBox="0 0 ${W} ${H}">${g}</svg>${legend(series)}`;
}
function hbars(rows, fmt) {
  const mx = Math.max(...rows.map(r => Math.abs(r[1])), 1e-9);
  return `<div class="hb2">${rows.map(r => `<div class="hr"><span title="${esc(r[0])}">${esc(r[0])}</span><span class="tr"><i style="width:${Math.abs(r[1]) / mx * 100}%;background:${r[1] < 0 ? '#d6403a' : r[2]}"></i></span><b>${fmt(r[1])}</b></div>`).join('')}</div>`;
}
function pie(parts, donut, fmt) {
  const tot = sum(parts, p => p[1]) || 1; let a = -Math.PI / 2, g = '';
  parts.forEach(([n, v, c]) => { const b = a + v / tot * Math.PI * 2, l = b - a > Math.PI ? 1 : 0, R = 100, r0 = donut ? 62 : 0, P = (ang, rad) => (110 + Math.cos(ang) * rad).toFixed(2) + ',' + (110 + Math.sin(ang) * rad).toFixed(2);
    g += donut ? `<path d="M${P(a, R)} A${R},${R} 0 ${l} 1 ${P(b - 1e-4, R)} L${P(b - 1e-4, r0)} A${r0},${r0} 0 ${l} 0 ${P(a, r0)}Z" fill="${c}" stroke="#fff" stroke-width="2"><title>${esc(n)}</title></path>` : `<path d="M110,110 L${P(a, R)} A${R},${R} 0 ${l} 1 ${P(b - 1e-4, R)}Z" fill="${c}" stroke="#fff" stroke-width="2"><title>${esc(n)}</title></path>`; a = b; });
  const top = parts.slice().sort((x, y) => y[1] - x[1])[0] || ['', 0];
  return `<div style="display:flex;gap:1rem;align-items:center"><svg viewBox="0 0 220 220" style="width:44%;max-width:230px;flex:none">${g}${donut ? `<text x="110" y="108" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2e30">${(top[1] / tot * 100).toFixed(0)}%</text><text x="110" y="128" text-anchor="middle" font-size="10.5" fill="#777">${esc(String(top[0]).slice(0, 22))}</text>` : ''}</svg>
  <div style="flex:1;min-width:0">${parts.map(([n, v, c]) => `<div style="display:flex;gap:.5rem;align-items:center;font-size:.82rem;margin:.3rem 0"><i style="width:.8rem;height:.8rem;border-radius:3px;background:${c};flex:none"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span class="sp"></span><b>${(v / tot * 100).toFixed(1)}%</b></div>`).join('')}</div></div>`;
}
const legend = series => series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span><i style="background:${s.c || COL[k]}"></i>${esc(s.n)}</span>`).join('')}</div>` : '';

  if (AL.hasIA()) { try { nar = await AL.claude(AL.SYS + ' Eres analista de negocio. Con el resultado responde en español: 1) la respuesta directa con cifras, 2) una observación útil, 3) una acción sugerida. Máx. 80 palabras. Ventas y márgenes en millones de COP; porcentajes como fracción (0.93=93%). Datos de ejemplo con productos reales del catálogo.', `Pregunta: ${q}\nResultado: ${JSON.stringify(top)}`, { max: 350, tag: 'torre-narrar' }); } catch (e) { nar = ''; } }
  if (!nar) { const r0 = res.rows[0], k0 = cols[0]; nar = res.comparar ? `Mayor cambio: ${r0[k0]} (${pc(r0.cambio_pct)} entre el trimestre anterior y el último).` : `Primero en la lista: ${r0[k0]} con ${fmtV(main, r0[main])}.${AL.hasIA() ? '' : ' (Modo básico: conecta la IA en Ajustes para el análisis y las recomendaciones.)'}`; }
  const key = cols[0], isT = res.g.includes('mes') || res.g.includes('dia') || ['resina', 'produccion'].includes(plan.tabla), isP = PCT.has(main);
  const spec = { labels: res.rows.slice(0, 24).map(r => String(r[isT && !res.g.length ? 'mes' : key])), series: [{ n: main, v: res.rows.slice(0, 24).map(r => isP ? r[main] * 100 : r[main]), c: COL[1] }], fmt: v => isP ? v.toFixed(1) + '%' : AL.fmt(v), def: isT ? 'line' : 'hbar', zero: false };
  out.innerHTML = `<div class="ans card ai"><div class="nar">${esc(nar)}</div><button class="btn gr sm" id="asay">🔊 Escuchar</button><div style="margin-top:.6rem">${plan.tabla === 'inventario' ? '' : viz('ask', esc(q), spec)}</div><details style="margin-top:.6rem"><summary><b>Ver datos</b></summary><table class="tb"><tr>${cols.map(c => `<th>${esc(c.replace(/_/g, ' '))}</th>`).join('')}</tr>${res.rows.slice(0, 14).map(r => `<tr>${cols.map(c => `<td>${fmtV(c, r[c])}</td>`).join('')}</tr>`).join('')}</table></details><details style="margin-top:.5rem"><summary><b>Cómo armó la consulta</b> <span class="muted small">(${via})</span></summary><pre class="plan">${esc(JSON.stringify(plan, null, 1))}</pre></details></div>`;
  $('#asay').onclick = () => AL.narrar(nar); if (AL.cfg.voz) AL.say(nar.slice(0, 400));
  AL.queue('pregunta', { id: AL.uid(), ts: new Date().toISOString(), sesion: AL.cfg.sesion, titulo: q, estado: 'torre', json: JSON.stringify({ q, via, plan }) });
  AL.log('pregunta_datos', { caso_id: 'torre', area: 'Gerencia', via, ok: 'si', detalle: q.slice(0, 120) });
}
